services:
  # ==================== DB ====================
  db:
    image: postgres:15
    container_name: megazine-db
    restart: always
    env_file:
      - .env  
    ports:
      - "5433:5432"
    volumes:
      - ./db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==================== backend ====================
  backend:
    build: .
    container_name: megazine-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./chroma_data:/app/chroma_data
    depends_on:
      db:
        condition: service_healthy # DB가 healthcheck를 통과한 후에만 백엔드 시작