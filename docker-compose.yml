version: '3.8'

services:
  db:
    image: postgres:15
    container_name: megazine-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:  
      - ./db_data:/var/lib/postgresql/data
      
  # 백엔드 서비스
  backend:
    build: .
    container_name: megazine-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app  # 로컬 코드를 컨테이너에 동기화 (개발용)

volumes:
  postgres_data: